<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create viewing link</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:0 auto;padding:28px 18px 40px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:22px;padding:24px;box-shadow:0 8px 30px #17203312}.eyebrow{font-size:13px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.08em}.title{font-size:30px;line-height:1.1;margin:8px 0}.sub{color:#687386;line-height:1.5}.label{display:block;font-size:14px;font-weight:700;margin:18px 0 7px}.input{width:100%;padding:14px;border:1px solid #d9deea;border-radius:12px;font-size:16px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time{border:1.5px solid #d9deea;background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;font-size:16px;cursor:pointer}.time.on{border-color:#315efb;background:#eef3ff;color:#244bd0}.primary{width:100%;border:0;border-radius:14px;padding:16px;margin-top:22px;background:#315efb;color:#fff;font-size:17px;font-weight:750;cursor:pointer}.output{display:none;margin-top:18px}.output.show{display:block}.linkbox{background:#f3f5f9;border:1px solid #e1e5ed;border-radius:12px;padding:12px;font-size:12px;line-height:1.4;word-break:break-all}.copy{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;background:#172033;color:#fff;font-weight:750;font-size:16px;cursor:pointer}.note{font-size:12px;color:#7a8494;margin-top:12px;line-height:1.45}</style></head>
<body><div class="wrap"><div class="card"><div class="eyebrow">Ian · Create a viewing link</div><h1 class="title">Offer viewing times</h1><p class="sub">Pick the times you want to offer. Then copy one link into WhatsApp, Messenger, email or SpareRoom.</p>
<label class="label">Property / viewing location</label><input id="address" class="input" value="14 Example Street" placeholder="e.g. 14 Example Street">
<label class="label">First day</label><input id="day1" class="input" value="Saturday" placeholder="e.g. Saturday">
<label class="label">Second day</label><input id="day2" class="input" value="Monday" placeholder="e.g. Monday">
<label class="label">Viewing times</label><p class="note" style="margin-top:0">Tap the times you want to offer on both days.</p>
<div id="times1" class="times"></div><div id="times2" class="times" style="margin-top:8px"></div>
<button id="generate" class="primary">Generate viewing link</button>
<div id="output" class="output"><div style="font-weight:750">Your link is ready</div><div id="link" class="linkbox" style="margin-top:8px"></div><button id="copy" class="copy">Copy link</button><div id="copied" class="note"></div></div>
</div></div>
<script>
const choices=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];
function render(id){const box=document.getElementById(id);box.innerHTML=choices.map(t=>`<button type="button" class="time" data-time="${t}">${t}</button>`).join('');box.querySelectorAll('.time').forEach(b=>b.onclick=()=>b.classList.toggle('on'))}render('times1');render('times2');
function selected(id){return [...document.querySelectorAll('#'+id+' .time.on')].map(x=>x.dataset.time)}
document.getElementById('generate').onclick=()=>{const address=document.getElementById('address').value.trim()||'Viewing';const d1=document.getElementById('day1').value.trim()||'Day 1';const d2=document.getElementById('day2').value.trim()||'Day 2';const s1=selected('times1'),s2=selected('times2');if(!s1.length&&!s2.length){alert('Choose at least one viewing time.');return}const u=new URL('index.html',location.href);u.searchParams.set('address',address);u.searchParams.set('day1',d1);u.searchParams.set('slots1',s1.join(','));u.searchParams.set('day2',d2);u.searchParams.set('slots2',s2.join(','));const value=u.href;document.getElementById('link').textContent=value;document.getElementById('output').classList.add('show');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(value);document.getElementById('copied').textContent='Copied ✓ Now paste it into your message.'}catch(e){document.getElementById('copied').textContent='Select and copy the link above.'}}};
</script></body></html>
